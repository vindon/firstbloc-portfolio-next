name: Update visual baselines

# Regenerates the Linux Playwright screenshot baselines (e2e/**/*-chromium-linux.png) on the same
# runner image CI compares against, then commits them to the PR branch. Baselines generated on a
# developer machine (macOS) never match the runner, so an intentional visual change needs this.
#
# Trigger: add the `update-visual-baselines` label to a pull request. The label is removed when the
# run finishes, so it can be applied again later.
#
# Uses the `pull_request` event (not `pull_request_target`), so it runs the workflow and code from
# the PR branch itself. The job is skipped for PRs from forks, where the token could not push anyway.
#
# A push made with the default GITHUB_TOKEN does not start other workflows, so CI will not re-run on
# the new commit by itself. Push any follow-up commit (an empty one is enough) to re-run CI.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: update-visual-baselines-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# No permissions by default; the job asks for exactly what it needs.
permissions: {}

jobs:
  update:
    if: >-
      github.event.label.name == 'update-visual-baselines' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the regenerated baselines to the PR branch
      pull-requests: write # remove the trigger label afterwards
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Same dummy token as ci.yml: NEXT_PUBLIC_* is inlined at build time, and the cookie banner
        # only renders (and so only appears in the screenshots) when it is non-empty.
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: test-token-e2e
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Regenerate baselines
        run: npx playwright test responsive --update-snapshots

      - name: Commit updated baselines
        env:
          # Passed through the environment, never interpolated into the script, so a hostile branch
          # name cannot inject shell.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/responsive.spec.ts-snapshots/*-linux.png
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
            exit 0
          fi
          git commit -m "Update Linux visual baselines"
          git push origin "HEAD:${HEAD_REF}"

      - name: Remove trigger label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label update-visual-baselines
